<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <title>IEEE VESIT</title>

    <link rel="icon" href="/src/assets/ieee logo white.png" type="image/png" />

    <!-- Pick the theme before anything paints, so there is no light-to-dark flash.
         A saved choice wins; otherwise follow the device setting. -->
    <script>
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("ieee-theme");
          if (theme !== "dark" && theme !== "light") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Boxicons -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

    <link rel="preload" as="image" href="/loader-logo.webp" />

    <!-- Loader styles live here (not in the bundle) so the logo is on screen
         from the very first paint. The React loader reuses the same classes. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: #edf1f4;
        transition: opacity 0.55s cubic-bezier(0.22, 0.8, 0.24, 1), visibility 0.55s;
      }
      [data-theme="dark"] #boot-loader { background: #090f15; }
      #boot-loader.bl-hide { opacity: 0; visibility: hidden; }
      #boot-loader.bl-hide .bl-stage { transform: scale(1.08); }

      .bl-fill {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bg, #edf1f4);
      }
      .bl-inline {
        display: grid;
        place-items: center;
        min-height: 60vh;
      }

      .bl-stage {
        position: relative;
        width: 148px;
        height: 148px;
        display: grid;
        place-items: center;
        perspective: 700px;
        transition: transform 0.55s cubic-bezier(0.22, 0.8, 0.24, 1);
      }
      /* the glass disc the logo sits on */
      .bl-disc {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset, 0 18px 40px -16px rgba(13, 24, 34, 0.35);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }
      [data-theme="dark"] .bl-disc {
        background: rgba(24, 36, 48, 0.6);
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 18px 40px -16px rgba(0, 0, 0, 0.7);
      }
      /* one thin arc travelling around the disc */
      .bl-arc {
        position: absolute;
        inset: -7px;
        border-radius: 50%;
        border: 1.5px solid transparent;
        border-top-color: #00629b;
        animation: bl-orbit 1.6s linear infinite;
      }
      [data-theme="dark"] .bl-arc { border-top-color: #4db3ea; }

      .bl-logo {
        position: relative;
        width: 78px;
        height: 78px;
        object-fit: contain;
        animation: bl-turn 2.4s infinite;
        will-change: transform;
      }
      .bl-logo--dark { display: none; }
      [data-theme="dark"] .bl-logo--light { display: none; }
      [data-theme="dark"] .bl-logo--dark { display: block; }

      /* A full turn around the vertical axis, easing in and out of each half. */
      @keyframes bl-turn {
        0%   { transform: rotateY(0deg);   animation-timing-function: cubic-bezier(0.6, 0.05, 0.3, 1); }
        50%  { transform: rotateY(180deg); animation-timing-function: cubic-bezier(0.6, 0.05, 0.3, 1); }
        100% { transform: rotateY(360deg); }
      }
      @keyframes bl-orbit { to { transform: rotate(360deg); } }

      @media (prefers-reduced-motion: reduce) {
        .bl-logo { animation: bl-pulse 2s ease-in-out infinite; }
        .bl-arc { animation: none; border-color: transparent; }
        @keyframes bl-pulse { 50% { opacity: 0.45; } }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Loading IEEE VESIT">
      <div class="bl-stage">
        <span class="bl-disc"></span>
        <span class="bl-arc"></span>
        <img class="bl-logo bl-logo--light" src="/loader-logo.webp" alt="" width="78" height="78" />
        <img class="bl-logo bl-logo--dark" src="/loader-logo-white.webp" alt="" width="78" height="78" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
